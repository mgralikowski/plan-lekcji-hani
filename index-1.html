<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e8b4c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Hani">
<meta name="application-name" content="Plan Hani">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Plan lekcji Hani — interaktywny plan na telefon 🐱">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Plan lekcji — Hania 🐱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #d9b8c4;
    --bg-2: #c9a3b5;
    --card: #fdf6f0;
    --card-soft: #fff9f4;
    --ink: #3d2a35;
    --ink-soft: #6b4e5c;
    --accent: #ff5d8f;
    --accent-2: #ffb3c6;
    --shadow: 0 8px 24px rgba(61, 42, 53, 0.18);
    --shadow-sm: 0 4px 12px rgba(61, 42, 53, 0.12);

    --c-kod: #ffd6a5;
    --c-wf: #a0e7a0;
    --c-ed: #ffc8dd;
    --c-ang: #bde0fe;
    --c-teatr: #e0c3fc;
    --c-empty: #f0e5ec;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #e8c4d0 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #d4a5b8 0%, transparent 50%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,0.4) 0 3px, transparent 4px),
      radial-gradient(circle at 10% 18%, rgba(255,255,255,0.4) 0 2px, transparent 3px),
      radial-gradient(circle at 13% 17%, rgba(255,255,255,0.4) 0 2px, transparent 3px),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.3) 0 3px, transparent 4px),
      radial-gradient(circle at 85% 40%, rgba(255,255,255,0.25) 0 2px, transparent 3px);
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  header {
    text-align: center;
    padding: 8px 0 20px;
    position: relative;
  }

  .kitty {
    font-size: 56px;
    display: inline-block;
    animation: bob 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-size: 44px;
    font-weight: 700;
    margin: 4px 0 0;
    color: #fff;
    text-shadow:
      2px 2px 0 #3d2a35,
      -1px -1px 0 #3d2a35,
      1px -1px 0 #3d2a35,
      -1px 1px 0 #3d2a35,
      0 6px 14px rgba(0,0,0,0.2);
    letter-spacing: 1px;
  }

  .name {
    display: inline-block;
    font-family: 'Caveat', cursive;
    font-size: 28px;
    color: #fff;
    background: var(--accent);
    padding: 2px 18px 4px;
    border-radius: 999px;
    margin-top: 6px;
    box-shadow: var(--shadow-sm);
    transform: rotate(-2deg);
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin: 20px 0 16px;
    padding: 6px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 18px;
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1;
    min-width: 60px;
    border: none;
    background: transparent;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 10px 6px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }

  .tab .short { display: block; font-size: 15px; }
  .tab .num { display: block; font-size: 10px; opacity: 0.6; margin-top: 2px; }

  .tab.active {
    background: var(--card);
    color: var(--accent);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }

  .tab.today::after {
    content: "";
    position: absolute;
    top: 4px;
    right: 8px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  .day-view { animation: slideIn 0.35s ease; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .lesson {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border-radius: 20px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    position: relative;
    transition: transform 0.2s ease;
  }

  .lesson:active { transform: scale(0.98); }

  .lesson.empty {
    background: var(--card-soft);
    box-shadow: var(--shadow-sm);
  }
  .empty .icon-circle { background: #ffe8a3; }
  .empty .name-text { color: var(--ink); font-size: 15px; }

  .lesson.now {
    box-shadow: 0 0 0 3px var(--accent), var(--shadow);
    transform: scale(1.02);
  }

  .lesson.now::before {
    content: "teraz";
    position: absolute;
    top: -9px;
    right: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }

  .time {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    min-width: 78px;
    line-height: 1;
  }
  .time .to {
    display: block;
    font-size: 16px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .subject {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .icon-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.08);
  }

  .name-text {
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.2;
    min-width: 0;
  }

  .empty .name-text { color: var(--ink-soft); font-style: italic; font-size: 13px; }

  .paw {
    position: absolute;
    font-size: 16px;
    opacity: 0.4;
    pointer-events: none;
  }

  .paw.p1 { top: 80px; left: 8px; transform: rotate(-20deg); }
  .paw.p2 { top: 150px; right: 12px; transform: rotate(15deg); }
  .paw.p3 { bottom: 60px; left: 15px; transform: rotate(30deg); }
  .paw.p4 { bottom: 120px; right: 8px; transform: rotate(-10deg); }

  footer {
    text-align: center;
    margin-top: 20px;
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: #fff;
    opacity: 0.85;
    text-shadow: 1px 1px 0 rgba(61, 42, 53, 0.3);
  }

  .footer-paws {
    margin-top: 8px;
    font-size: 14px;
    letter-spacing: 6px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="paw p1">🐾</div>
  <div class="paw p2">🐾</div>
  <div class="paw p3">🐾</div>
  <div class="paw p4">🐾</div>

  <div class="app">
    <header>
      <div class="kitty">🐱</div>
      <h1>Plan lekcji</h1>
      <div class="name">Hania</div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="dayView" class="day-view"></main>

    <footer>
      miau miau 💕
      <div class="footer-paws">🐾 🐾 🐾 🐾 🐾</div>
    </footer>
  </div>

<script>
  const SUBJECTS = {
    kod:   { name: "Kodowanie",            icon: "💻", color: "var(--c-kod)" },
    wf:    { name: "W-F",                  icon: "⚽", color: "var(--c-wf)" },
    ed:    { name: "Ed. wczesnoszkolna",   icon: "✏️", color: "var(--c-ed)" },
    ang:   { name: "J. angielski",         icon: "🇬🇧", color: "var(--c-ang)" },
    teatr: { name: "Kółko teatralne",      icon: "🎭", color: "var(--c-teatr)" },
  };

  const SLOTS = [
    { start: "08:00", end: "08:45" },
    { start: "08:55", end: "09:40" },
    { start: "09:50", end: "10:35" },
    { start: "10:45", end: "11:30" },
    { start: "11:50", end: "12:35" },
  ];

  const SCHEDULE = {
    1: [ "kod", "wf",  "ed",  "ed",  "ed",  { start: "13:50", end: "14:35", key: "teatr" } ],
    2: [ "ed",  "ed",  "ang", "wf",  null,  { start: "12:50", end: "13:40", key: "teatr" } ],
    3: [ null,  "ang", "ed",  "ed",  "ed",  null ],
    4: [ null,  "wf",  "ed",  "ed",  "ed",  { start: "13:50", end: "14:35", key: "teatr" } ],
    5: [ "ed",  "ed",  "ed",  "ed",  null,  null ],
  };

  const DAYS = [
    { n: 1, short: "Pon", long: "Poniedziałek" },
    { n: 2, short: "Wt",  long: "Wtorek" },
    { n: 3, short: "Śr",  long: "Środa" },
    { n: 4, short: "Czw", long: "Czwartek" },
    { n: 5, short: "Pt",  long: "Piątek" },
  ];

  const now = new Date();
  const todayDow = now.getDay();
  const todayIsSchoolDay = todayDow >= 1 && todayDow <= 5;
  const initialDay = todayIsSchoolDay ? todayDow : 1;

  const tabsEl = document.getElementById("tabs");
  const viewEl = document.getElementById("dayView");

  DAYS.forEach(d => {
    const btn = document.createElement("button");
    btn.className = "tab";
    if (d.n === initialDay) btn.classList.add("active");
    if (d.n === todayDow) btn.classList.add("today");
    btn.innerHTML = `<span class="short">${d.short}</span>`;
    btn.addEventListener("click", () => selectDay(d.n));
    tabsEl.appendChild(btn);
  });

  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function isNow(start, end, dayNum) {
    if (dayNum !== todayDow) return false;
    const mins = now.getHours() * 60 + now.getMinutes();
    return mins >= timeToMinutes(start) && mins < timeToMinutes(end);
  }

  function renderDay(dayNum) {
    const rows = SCHEDULE[dayNum];
    viewEl.innerHTML = "";
    viewEl.classList.remove("day-view");
    void viewEl.offsetWidth;
    viewEl.classList.add("day-view");

    rows.forEach((entry, i) => {
      let slot, key;
      if (entry && typeof entry === "object") {
        slot = { start: entry.start, end: entry.end };
        key = entry.key;
      } else {
        slot = SLOTS[i];
        if (!slot) return;
        key = entry;
      }

      const div = document.createElement("div");
      div.className = "lesson";

      if (!key) {
        div.classList.add("empty");
        div.innerHTML = `
          <div class="time">${slot.start}<span class="to">${slot.end}</span></div>
          <div class="subject">
            <div class="icon-circle">🧸</div>
            <div class="name-text">Świetlica</div>
          </div>`;
      } else {
        const s = SUBJECTS[key];
        if (isNow(slot.start, slot.end, dayNum)) div.classList.add("now");
        div.innerHTML = `
          <div class="time">${slot.start}<span class="to">${slot.end}</span></div>
          <div class="subject">
            <div class="icon-circle" style="background:${s.color}">${s.icon}</div>
            <div class="name-text">${s.name}</div>
          </div>`;
      }
      viewEl.appendChild(div);
    });
  }

  function selectDay(n) {
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("active", DAYS[i].n === n);
    });
    renderDay(n);
  }

  renderDay(initialDay);

  setInterval(() => {
    const activeTab = document.querySelector(".tab.active");
    const idx = Array.from(document.querySelectorAll(".tab")).indexOf(activeTab);
    if (idx >= 0) renderDay(DAYS[idx].n);
  }, 60000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
